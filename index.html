    <title>Redirecting to Project Update</title>
    <style>
        :root {
            --gulf-blue: #003f70;
            --gulf-green: #63bd74;
            --muted: #6b7a8a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            color: var(--gulf-blue);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at -8% 0, var(--gulf-blue) 0 16rem, transparent 16.1rem),
                radial-gradient(circle at 108% 88%, var(--gulf-green) 0 12rem, transparent 12.1rem),
                #ffffff;
        }

        main {
            width: min(520px, calc(100% - 32px));
            padding: 32px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #dce8ef;
            border-radius: 24px;
            box-shadow: 0 18px 45px rgba(0, 63, 112, 0.12);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 6vw, 44px);
            line-height: 1.08;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
        }

        a {
            display: inline-flex;
            padding: 11px 18px;
            color: #ffffff;
            font-weight: 800;
            text-decoration: none;
            background: var(--gulf-blue);
            border-radius: 999px;
        }
